name: WorkNoteAdmin
options:
  bundleIdPrefix: jp.co.home-search
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ja
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
targets:
  WorkNoteAdmin:
    type: application
    platform: iOS
    sources:
      - path: WorkNoteAdmin
    info:
      path: WorkNoteAdmin/Info.plist
      properties:
        CFBundleDisplayName: ワークノート管理
        CFBundleDevelopmentRegion: ja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 表示する管理者アプリ（Web）の URL
        WorkNoteAdminURL: https://worknote-6dc51.web.app
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.business
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.home-search.worknote.admin
        PRODUCT_NAME: WorkNoteAdmin
        # iPad と Mac（Mac Catalyst）
        TARGETED_DEVICE_FAMILY: "2,6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: WorkNoteAdmin/WorkNoteAdmin.entitlements
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
schemes:
  WorkNoteAdmin:
    build:
      targets:
        WorkNoteAdmin: all
    run:
      config: Debug
    archive:
      config: Release
